<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scan&Save - Comparateur de prix</title>
    <script src="https://accounts.google.com/gsi/client" async defer></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap');

        body {
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(135deg, #e0c3fc 0%, #8ec5fc 100%);
            min-height: 100vh;
            margin: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #333;
        }

        .app-container {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            border-radius: 24px;
            padding: 40px;
            width: 90%;
            max-width: 450px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.1);
            text-align: center;
        }

        h1 {
            margin: 0 0 5px 0;
            font-size: 2.2em;
            color: #2c3e50;
        }

        p.subtitle {
            color: #7f8c8d;
            margin-bottom: 30px;
            font-size: 0.95em;
        }

        #auth-block {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 15px;
        }

        #scan-block {
            display: none;
            animation: fadeIn 0.6s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(15px); }
            to { opacity: 1; transform: translateY(0); }
        }

        #user-name {
            color: #34495e;
            margin-bottom: 15px;
            font-size: 1.3em;
        }

        #btn-logout {
            background: transparent;
            border: 2px solid #e74c3c;
            color: #e74c3c;
            padding: 6px 16px;
            border-radius: 20px;
            cursor: pointer;
            font-weight: 600;
            font-size: 0.85em;
            transition: all 0.3s ease;
            margin-bottom: 30px;
        }

        #btn-logout:hover {
            background: #e74c3c;
            color: white;
            transform: scale(1.05);
        }

        .file-upload-wrapper {
            margin-bottom: 25px;
        }

        #ticket-file {
            width: 100%;
            padding: 15px;
            border: 2px dashed #bdc3c7;
            border-radius: 12px;
            background: #fdfdfd;
            cursor: pointer;
            box-sizing: border-box;
            transition: all 0.3s ease;
            font-family: 'Poppins', sans-serif;
            color: #7f8c8d;
        }

        #ticket-file:hover {
            border-color: #3498db;
            background: #f4f9fd;
        }

        #btn-scan {
            background: linear-gradient(135deg, #6a11cb 0%, #2575fc 100%);
            color: white;
            border: none;
            padding: 15px 30px;
            font-size: 16px;
            border-radius: 12px;
            font-weight: 600;
            cursor: pointer;
            width: 100%;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }

        #btn-scan:hover {
            transform: translateY(-3px);
            box-shadow: 0 10px 20px rgba(37, 117, 252, 0.4);
        }

        #btn-scan:active {
            transform: translateY(0);
        }

        #resultat {
            margin-top: 25px;
            border-radius: 12px;
            font-weight: 500;
            transition: all 0.3s ease;
        }

        .result-card {
            background: #f0fdf4;
            border: 1px solid #bbf7d0;
            border-left: 5px solid #22c55e;
            padding: 20px;
            border-radius: 12px;
            text-align: left;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
            animation: fadeIn 0.4s ease;
        }

        .result-card p {
            margin: 8px 0;
            color: #166534;
        }
    </style>
</head>
<body>
    <div class="app-container">
        <h1>🛒 Scan&Save</h1>
        <p class="subtitle">La solution intelligente pour comparer vos tickets de caisse.</p>

        <div id="auth-block">
            <div id="g_id_onload"
                 data-client_id="239338171655-hm0ru2n35k46j2m5et58tfuq4c82vrmm.apps.googleusercontent.com"
                 data-callback="handleCredentialResponse"
                 data-auto_select="false"
                 data-itp_support="true">
            </div>
            <div class="g_id_signin" data-type="standard" data-shape="pill" data-theme="filled_blue" data-size="large"></div>
        </div>

        <div id="scan-block">
            <h3 id="user-name"></h3>
            <button id="btn-logout">Se déconnecter</button>

            <div class="file-upload-wrapper">
                <input type="file" id="ticket-file" accept="image/*">
            </div>
            
            <button id="btn-scan">🔍 Lancer l'analyse du ticket</button>
        </div>

        <div id="resultat"></div>
    </div>

    <script>
        let currentUserId = null;

        async function handleCredentialResponse(response) {
            try {
                const res = await fetch('/api/auth/google', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ token: response.credential })
                });

                if (res.ok) {
                    const user = await res.json();
                    
                    currentUserId = user.googleId; 
                    
                    document.getElementById('auth-block').style.display = 'none';
                    document.getElementById('scan-block').style.display = 'block';
                    document.getElementById('user-name').innerText = "Bonjour " + user.name + " ! 👋";
                }
            } catch (err) {
                console.error(err);
            }
        }

        document.getElementById('btn-logout').addEventListener('click', () => {
            document.getElementById('scan-block').style.display = 'none';
            document.getElementById('auth-block').style.display = 'flex';
            document.getElementById('resultat').innerHTML = "";
            document.getElementById('ticket-file').value = "";
            
            currentUserId = null; 
        });

        document.getElementById('btn-scan').addEventListener('click', async () => {
            const resDiv = document.getElementById('resultat');
            const fileInput = document.getElementById('ticket-file');
            
            if (fileInput.files.length === 0) {
                resDiv.style.color = "#e74c3c";
                resDiv.innerHTML = "<p>⚠️ Veuillez d'abord choisir une photo de ticket.</p>";
                return;
            }

            resDiv.style.color = "#3498db";
            resDiv.innerHTML = "<p>⏳ Analyse et sauvegarde en cours...</p>";
            
            const formData = new FormData();
            formData.append('ticket', fileInput.files[0]);
            formData.append('googleId', currentUserId); 

            try {
                const reponse = await fetch('/api/comparer-ticket', { 
                    method: 'POST',
                    body: formData 
                });
                
                const data = await reponse.json();
                
                if (reponse.ok) {
                    resDiv.innerHTML = `
                        <div class="result-card">
                            <p><strong>🏆 Enseigne gagnante :</strong> ${data.enseigneGagnante}</p>
                            <p><strong>💶 Total :</strong> ${data.prixTotal} €</p>
                            <p style="color: #64748b; font-size: 0.85em; font-weight: normal; margin-top: 15px;">
                                💾 Sauvegardé automatiquement dans votre historique.
                            </p>
                        </div>
                    `;
                }
            } catch (err) {
                resDiv.style.color = "#e74c3c";
                resDiv.innerHTML = "<p>❌ Erreur de connexion au serveur.</p>";
            }
        });
    </script>
</body>
</html>
